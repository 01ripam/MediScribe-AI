services:
  - type: web
    name: patient-api
    env: docker
    rootDir: backend
    plan: free
    autoDeploy: true
    healthCheckPath: /docs
    envVars:
      - key: APP_NAME
        value: Patient Side API
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: patient_platform
      - key: APP_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://doctor.ashish.com,https://patient-api.onrender.com,https://*.render.com
      - key: PORT
        value: 8000
