services:
  db:
    image: postgres:16
    container_name: patient_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: patient_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - patient_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d patient_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.production.example
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  patient_db_data:
